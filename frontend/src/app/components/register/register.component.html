<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path d="M3 17L9 11L13 15L21 7" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 7H21V11" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="auth-logo-text">FundScope</span>
    </div>
    <h2 class="auth-title">Create your account</h2>
    <p class="auth-subtitle">Get started with FundScope</p>

    <div *ngIf="error" class="auth-error">{{ error }}</div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="name-row">
        <div class="form-group">
          <label for="firstName">First name</label>
          <input
            id="firstName"
            type="text"
            [(ngModel)]="firstName"
            name="firstName"
            placeholder="John"
            required
            autocomplete="given-name"
          />
        </div>
        <div class="form-group">
          <label for="lastName">Last name</label>
          <input
            id="lastName"
            type="text"
            [(ngModel)]="lastName"
            name="lastName"
            placeholder="Doe"
            required
            autocomplete="family-name"
          />
        </div>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Choose a username"
          required
          minlength="3"
          autocomplete="username"
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Min 6 characters"
          required
          minlength="6"
          autocomplete="new-password"
        />
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading || !firstName || !lastName || !username || !password">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
